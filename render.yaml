# Render blueprint. Push this repo to GitHub, then in Render:
#   New > Blueprint > pick the repo. It reads this file.
#
# Free plan, same as the other app on this account — no card on file, no billing.
#
# The trade-off: a persistent disk requires a paid instance, so the SQLite file
# lives on the container's ephemeral filesystem and is wiped on every redeploy
# and on every wake from the free plan's idle sleep. `scripts/boot.ts` handles
# that by restoring a committed snapshot of a real extraction run, so a reviewer
# always lands on a populated comparison grid rather than an empty one. They can
# still re-run extraction live from the UI — the loops are real either way.
#
# To make the data genuinely durable instead, put a free Turso database behind
# it: set LIBSQL_URL to a libsql:// URL and LIBSQL_AUTH_TOKEN alongside it. No
# code changes; the snapshot restore then steps aside on its own.

services:
  - type: web
    name: clearline
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Required — the AI loops are real and will not run without a key.
      # Set it in the Render dashboard; never commit one.
      - key: GEMINI_API_KEY
        sync: false

      # The other provider. Add it in the dashboard to switch: provider.ts
      # uses whichever key is present, and CLEARLINE_PROVIDER breaks the tie
      # when both are. Kept out of the blueprint so a first deploy is not
      # blocked asking for a key you may not hold.
      # - key: ANTHROPIC_API_KEY
      #   sync: false


      # Signs the short-TTL vendor-document links.
      - key: CLEARLINE_SIGNING_KEY
        generateValue: true


      # Uncomment and set both to move the database to Turso and survive restarts.
      # - key: LIBSQL_URL
      #   sync: false
      # - key: LIBSQL_AUTH_TOKEN
      #   sync: false
